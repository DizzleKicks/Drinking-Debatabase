<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinking Debatabase</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <h1>🍺 Drinking Debatabase</h1>

    <div class="level" id="levelTitle">
        Loading...
    </div>

    <div class="card">

        <h2 id="question">
            Loading...
        </h2>

        <p id="category"></p>

        <p id="type"></p>

    </div>

    <div class="buttons">

        <button onclick="newQuestion()">🎲 Another Topic</button>

        <button onclick="levelDown()">⬇ Level Down</button>

        <button onclick="levelUp()">⬆ Level Up</button>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
